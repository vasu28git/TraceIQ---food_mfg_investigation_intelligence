spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investigation_platform_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.investigation.platform: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
