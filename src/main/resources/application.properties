# Server
server.port=8080

# DataSource - Neon PostgreSQL (pooled)
# Production values must be supplied via environment variables; no real credentials are committed.
# Example: DATABASE_URL=jdbc:postgresql://ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-shiny-salad-aygxj11y.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_q1UKOdLTQG0S}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - don't fail fast when Neon is unreachable (so app can still boot and endpoints are mapped)
# Increased from 5 to 20 to handle concurrent Neo4j projection + discovery holding connections (fixes HikariPool-1 timeout)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.continue-on-error=true

# JPA / Hibernate - use none to allow Platform Admin login even when DB is unreachable; set to update when DB is reachable to auto-create tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Platform Admin - MUST be supplied via environment in production; default provided for local dev.
app.platform-admin.email=${PLATFORM_ADMIN_EMAIL:admin@taceiq.local}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:Admin123!}

# JWT - MUST be supplied via environment in production; default provided for local dev.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Provisioning - initial organization user default password (env-driven, optional for local dev)
app.provisioning.initial-password=${PROVISIONING_INITIAL_PASSWORD:ChangeMe123!}

# Neo4j - graph projection (optional, app starts without it)
app.neo4j.uri=${NEO4J_URI:}
app.neo4j.username=${NEO4J_USERNAME:}
app.neo4j.password=${NEO4J_PASSWORD:}
app.neo4j.database=${NEO4J_DATABASE:neo4j}

# AI - Gemini (NoOp by default, real provider via env - never commit raw key)
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.files.storage-path=${FILES_STORAGE_PATH:./uploads}
app.files.max-size-mb=10

# Flyway - disabled for now (migrations applied manually via JDBC, see docs)
# Enable when real migration automation is needed; currently causes circular depends-on with ddl-auto=none
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
